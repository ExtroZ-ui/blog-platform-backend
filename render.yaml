services:
  - type: web
    name: blog-platform-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: blog-platform-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 30
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: 7
      - key: CORS_ORIGINS
        value: http://localhost:3000,http://localhost:5173,http://127.0.0.1:5173,https://blog-platform-frontend-9qda.onrender.com

  - type: web
    name: blog-platform-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://blog-platform-api-m7cc.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: blog-platform-db
    databaseName: blog_platform
    user: blog_user
    plan: free
    region: frankfurt